
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Patas & Bigodes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">

    <link rel="stylesheet" th:href="@{/css/cadastro.css}">
</head>

<body>

<header>
    <nav class="navbar">
        <div class="container-fluid px-4">

            <a th:href="@{/}" class="navbar-brand"
               aria-label="Página inicial">
                <img th:src="@{/img/logo.png}"
                     alt="Logo Patas & Bigodes"
                     class="logo">
            </a>

            <a th:href="@{/}" class="btn-voltar"
               title="Voltar para a página inicial"
               aria-label="Voltar para a página inicial">
                <i class="bi bi-arrow-left"></i>
            </a>

        </div>
    </nav>
</header>

<main>
    <div class="conteudo-principal">

        <h1 class="titulo">Cadastre-se</h1>

        <div class="linha-titulo"></div>

        <p class="subtitulo">
            Crie seu cadastro e mantenha as informações do seu pet organizadas.
        </p>

        <div th:if="${erro}"
             class="alert alert-danger"
             th:text="${erro}">
        </div>

        <div th:if="${sucesso}"
             class="alert alert-success"
             th:text="${sucesso}">
        </div>

        <form class="formulario-cadastro"
              id="formularioCadastro"
              th:action="@{/cadastro}"
              method="post">

            <div class="formularios">

                <section class="formulario"
                         aria-labelledby="tituloAnimal">

                    <div class="cabecalho-formulario">

                        <div class="icone-formulario">
                            <i class="bi bi-heart-pulse-fill"></i>
                        </div>

                        <div>
                            <h2 class="titulo-formulario"
                                id="tituloAnimal">
                                Dados do Animal
                            </h2>

                            <p class="descricao-formulario">
                                Informe os dados do seu pet
                            </p>
                        </div>

                    </div>

                    <label for="nomeAnimal" class="form-label">
                        Nome do Animal
                    </label>

                    <input type="text"
                           class="form-control"
                           id="nomeAnimal"
                           name="nomeAnimal"
                           placeholder="Digite o nome do animal"
                           maxlength="100"
                           required>

                    <label class="form-label">
                        Sexo
                    </label>

                    <div class="opcoes">

                        <div class="form-check">
                            <input class="form-check-input"
                                   type="radio"
                                   name="sexo"
                                   id="macho"
                                   value="Macho"
                                   required>

                            <label class="form-check-label"
                                   for="macho">
                                Macho
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input"
                                   type="radio"
                                   name="sexo"
                                   id="femea"
                                   value="Fêmea">

                            <label class="form-check-label"
                                   for="femea">
                                Fêmea
                            </label>
                        </div>

                    </div>

                    <label for="idade" class="form-label">
                        Idade
                    </label>

                    <input type="number"
                           class="form-control"
                           id="idade"
                           name="idade"
                           placeholder="Digite a idade em anos"
                           min="0"
                           max="100"
                           step="1">

                    <label for="especie" class="form-label">
                        Espécie
                    </label>

                    <select class="form-select"
                            id="especie"
                            name="especie"
                            required>

                        <option value="" selected disabled>
                            Selecione a espécie
                        </option>

                        <option value="Cachorro">Cachorro</option>
                        <option value="Gato">Gato</option>
                        <option value="Ave">Ave</option>
                        <option value="Outro">Outro</option>

                    </select>

                    <label for="raca" class="form-label">
                        Raça
                    </label>

                    <input type="text"
                           class="form-control"
                           id="raca"
                           name="raca"
                           placeholder="Digite a raça"
                           maxlength="100">

                </section>

                <section class="formulario"
                         aria-labelledby="tituloProprietario">

                    <div class="cabecalho-formulario">

                        <div class="icone-formulario">
                            <i class="bi bi-person-fill"></i>
                        </div>

                        <div>
                            <h2 class="titulo-formulario"
                                id="tituloProprietario">
                                Dados do Proprietário
                            </h2>

                            <p class="descricao-formulario">
                                Informe seus dados pessoais
                            </p>
                        </div>

                    </div>

                    <label for="proprietario" class="form-label">
                        Nome Completo
                    </label>

                    <input type="text"
                           class="form-control"
                           id="proprietario"
                           name="nomeProprietario"
                           placeholder="Digite seu nome completo"
                           maxlength="150"
                           autocomplete="name"
                           required>

                    <label for="cpf" class="form-label">
                        CPF
                    </label>

                    <input type="text"
                           class="form-control"
                           id="cpf"
                           name="cpf"
                           placeholder="000.000.000-00"
                           maxlength="14"
                           inputmode="numeric"
                           autocomplete="off"
                           required>

                    <label for="numero" class="form-label">
                        Número de Celular
                    </label>

                    <input type="tel"
                           class="form-control"
                           id="numero"
                           name="telefone"
                           placeholder="(00) 00000-0000"
                           maxlength="15"
                           inputmode="tel"
                           autocomplete="tel"
                           required>

                    <label for="email" class="form-label">
                        E-mail
                    </label>

                    <input type="email"
                           class="form-control"
                           id="email"
                           name="email"
                           placeholder="exemplo@email.com"
                           maxlength="150"
                           autocomplete="email"
                           required>

                    <label for="senha" class="form-label">
                        Senha
                    </label>

                    <input type="password"
                           class="form-control"
                           id="senha"
                           name="senha"
                           placeholder="Crie uma senha"
                           minlength="6"
                           maxlength="100"
                           autocomplete="new-password"
                           required>

                    <label for="cidade" class="form-label">
                        Cidade
                    </label>

                    <input type="text"
                           class="form-control"
                           id="cidade"
                           name="cidade"
                           placeholder="Digite sua cidade"
                           maxlength="100"
                           autocomplete="address-level2"
                           required>

                    <label for="bairro" class="form-label">
                        Bairro
                    </label>

                    <input type="text"
                           class="form-control"
                           id="bairro"
                           name="bairro"
                           placeholder="Digite seu bairro"
                           maxlength="100"
                           required>

                </section>

            </div>

            <div class="area-botao">

                <button type="submit" class="btn-cadastrar">
                    <i class="bi bi-check2-circle"></i>
                    Finalizar Cadastro
                </button>

            </div>

        </form>

    </div>
</main>

<footer>

    <div class="footer-content">

        <div class="footer-logo">

            <img th:src="@{/img/logo.png}"
                 alt="Patas & Bigodes">

            <div>
                <strong>Patas & Bigodes</strong>

                <span>
                    Cuidado que vira carinho.
                </span>
            </div>

        </div>

        <div class="footer-social">

            <a href="https://www.instagram.com/"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Instagram">
                <i class="bi bi-instagram"></i>
            </a>

            <a href="https://www.facebook.com/"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Facebook">
                <i class="bi bi-facebook"></i>
            </a>

        </div>

        <p>
            © 2026 Patas & Bigodes. Todos os direitos reservados.
        </p>

    </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/cadastro.js}"></script>

</body>
</html>
