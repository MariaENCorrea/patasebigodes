
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Tutor - Patas & Bigodes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/cadastro.css}">
</head>

<body>

<header class="text-center py-4">
    <a th:href="@{/}" class="text-decoration-none">
        <h1 class="titulo">Patas & Bigodes</h1>
    </a>
    <p class="subtitulo">Clínica Veterinária</p>
</header>

<main class="container py-4">

    <div class="formulario-container">

        <div class="text-center mb-4">
            <i class="bi bi-person-circle icone-cadastro"></i>
            <h2 class="mt-2">Cadastro de Tutor</h2>
            <p>Preencha seus dados para criar sua conta.</p>
        </div>

        <div th:if="${sucesso}" class="alert alert-success" role="alert">
            <span th:text="${sucesso}"></span>
        </div>

        <div th:if="${erro}" class="alert alert-danger" role="alert">
            <span th:text="${erro}"></span>
        </div>

        <form id="formularioCadastro"
              th:action="@{/cadastro}"
              method="post">

            <h5 class="mb-3">Dados pessoais</h5>

            <div class="mb-3">
                <label for="nome" class="form-label">Nome completo</label>
                <input type="text"
                       class="form-control"
                       id="nome"
                       name="nome"
                       placeholder="Digite seu nome completo"
                       required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="cpf" class="form-label">CPF</label>
                    <input type="text"
                           class="form-control"
                           id="cpf"
                           name="cpf"
                           placeholder="000.000.000-00"
                           maxlength="14"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="telefone" class="form-label">Telefone</label>
                    <input type="text"
                           class="form-control"
                           id="telefone"
                           name="telefone"
                           placeholder="(00) 00000-0000"
                           maxlength="15"
                           required>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email"
                       class="form-control"
                       id="email"
                       name="email"
                       placeholder="seuemail@email.com"
                       required>
            </div>

            <div class="mb-4">
                <label for="senha" class="form-label">Senha</label>
                <input type="password"
                       class="form-control"
                       id="senha"
                       name="senha"
                       placeholder="Mínimo de 6 caracteres"
                       minlength="6"
                       required>
            </div>

            <h5 class="mb-3">Endereço</h5>

            <div class="mb-3">
                <label for="cep" class="form-label">CEP</label>
                <input type="text"
                       class="form-control"
                       id="cep"
                       name="cep"
                       placeholder="00000-000"
                       maxlength="9"
                       required>
            </div>

            <div class="mb-3">
                <label for="rua" class="form-label">Rua</label>
                <input type="text"
                       class="form-control"
                       id="rua"
                       name="rua"
                       placeholder="Nome da rua"
                       required>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="numero" class="form-label">Número</label>
                    <input type="text"
                           class="form-control"
                           id="numero"
                           name="numero"
                           placeholder="Número"
                           required>
                </div>

                <div class="col-md-8 mb-3">
                    <label for="complemento" class="form-label">
                        Complemento
                    </label>
                    <input type="text"
                           class="form-control"
                           id="complemento"
                           name="complemento"
                           placeholder="Apartamento, casa, etc.">
                </div>
            </div>

            <div class="mb-3">
                <label for="bairro" class="form-label">Bairro</label>
                <input type="text"
                       class="form-control"
                       id="bairro"
                       name="bairro"
                       placeholder="Seu bairro"
                       required>
            </div>

            <div class="row">
                <div class="col-md-8 mb-3">
                    <label for="cidade" class="form-label">Cidade</label>
                    <input type="text"
                           class="form-control"
                           id="cidade"
                           name="cidade"
                           placeholder="Sua cidade"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label for="estado" class="form-label">Estado</label>
                    <input type="text"
                           class="form-control"
                           id="estado"
                           name="estado"
                           placeholder="UF"
                           maxlength="2"
                           required>
                </div>
            </div>

            <button type="submit" class="btn btn-cadastro w-100 mt-3">
                Criar minha conta
            </button>

        </form>

        <div class="text-center mt-4">
            <p>
                Já possui uma conta?
                <a th:href="@{/login}">Faça login</a>
            </p>
        </div>

    </div>

</main>

<footer class="text-center py-3">
    <p>© 2026 Patas & Bigodes — Clínica Veterinária</p>
</footer>

<script th:src="@{/js/cadastro.js}"></script>

</body>
</html>
