<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

        <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Agendar consulta - Patas & Bigodes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container py-5">

    <div class="card shadow-sm mx-auto" style="max-width: 700px;">

        <div class="card-header text-white"
             style="background-color: #034C3C;">
            <h3 class="mb-0">Agendar consulta</h3>
        </div>

        <div class="card-body">

            <div th:if="${erro}" class="alert alert-danger">
                <span th:text="${erro}"></span>
            </div>

            <form th:action="@{/consultas/salvar}"
                  th:object="${consulta}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label">Animal</label>

                    <select name="animalId" class="form-select" required>
                        <option value="">Selecione o animal</option>

                        <option th:each="animal : ${animais}"
                                th:value="${animal.id}"
                                th:text="${animal.nome}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Tipo de consulta</label>

                    <input type="text"
                           th:field="*{consulta}"
                           class="form-control"
                           placeholder="Ex.: Consulta de rotina"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Especialidade</label>

                    <input type="text"
                           th:field="*{especialidade}"
                           class="form-control"
                           placeholder="Ex.: Clínica geral"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Data</label>

                    <input type="date"
                           th:field="*{data}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Horário</label>

                    <input type="time"
                           th:field="*{horario}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Informações adicionais</label>

                    <textarea th:field="*{informacoes}"
                              class="form-control"
                              rows="4"
                              placeholder="Descreva o motivo da consulta">
                    </textarea>
                </div>

                <div class="d-flex justify-content-between">

                    <a th:href="@{/consultas}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button type="submit"
                            class="btn text-white"
                            style="background-color: #034C3C;">
                        Agendar consulta
                    </button>

                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
