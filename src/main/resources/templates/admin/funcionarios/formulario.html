
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Funcionário | Patas & Bigodes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1"
                th:text="${funcionario.id == null ? 'Cadastrar Funcionário' : 'Editar Funcionário'}">
                Cadastrar Funcionário
            </h2>

            <p class="text-muted mb-0">
                Preencha os dados do funcionário e selecione suas especialidades.
            </p>
        </div>

        <a th:href="@{/admin/funcionarios}"
           class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i>
            Voltar
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">

            <form th:action="@{/admin/funcionarios/salvar}"
                  th:object="${funcionario}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label for="nome" class="form-label">
                            Nome completo
                        </label>

                        <input type="text"
                               id="nome"
                               th:field="*{nome}"
                               class="form-control"
                               placeholder="Digite o nome completo"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label for="cpf" class="form-label">
                            CPF
                        </label>

                        <input type="text"
                               id="cpf"
                               th:field="*{cpf}"
                               class="form-control"
                               placeholder="000.000.000-00"
                               maxlength="14"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label for="telefone" class="form-label">
                            Telefone
                        </label>

                        <input type="text"
                               id="telefone"
                               th:field="*{telefone}"
                               class="form-control"
                               placeholder="(00) 00000-0000"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label">
                            E-mail
                        </label>

                        <input type="email"
                               id="email"
                               th:field="*{email}"
                               class="form-control"
                               placeholder="funcionario@email.com"
                               required>
                    </div>

                    <div class="col-12">
                        <label class="form-label">
                            Especialidades
                        </label>

                        <div class="border rounded p-3">

                            <div th:if="${#lists.isEmpty(especialidades)}"
                                 class="text-muted">
                                Nenhuma especialidade ativa cadastrada.
                            </div>

                            <div class="row"
                                 th:unless="${#lists.isEmpty(especialidades)}">

                                <div class="col-md-4 mb-2"
                                     th:each="especialidade : ${especialidades}">

                                    <div class="form-check">

                                        <input class="form-check-input"
                                               type="checkbox"
                                               name="especialidadesIds"
                                               th:value="${especialidade.id}"
                                               th:checked="${funcionario.especialidades != null and funcionario.especialidades.contains(especialidade)}"                                               th:id="'especialidade-' + ${especialidade.id}">

                                        <label class="form-check-label"
                                               th:for="'especialidade-' + ${especialidade.id}"
                                               th:text="${especialidade.nome}">
                                            Especialidade
                                        </label>

                                    </div>
                                </div>
                            </div>

                        </div>

                        <small class="text-muted">
                            Selecione uma ou mais especialidades.
                        </small>
                    </div>

                    <div class="col-12">
                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   th:field="*{ativo}"
                                   id="ativo">

                            <label class="form-check-label"
                                   for="ativo">
                                Funcionário ativo
                            </label>
                        </div>
                    </div>

                    <div class="col-12 d-flex justify-content-end gap-2 mt-4">

                        <a th:href="@{/admin/funcionarios}"
                           class="btn btn-outline-secondary">
                            Cancelar
                        </a>

                        <button type="submit"
                                class="btn btn-success">
                            <i class="bi bi-check-lg"></i>
                            Salvar funcionário
                        </button>

                    </div>

                </div>
            </form>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
