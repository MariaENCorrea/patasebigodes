
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funcionários | Patas & Bigodes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container-fluid">
        <a th:href="@{/admin/dashboard}" class="navbar-brand">
            <i class="bi bi-shield-lock"></i>
            Administrativo
        </a>

        <a th:href="@{/admin/logout}" class="btn btn-outline-light btn-sm">
            <i class="bi bi-box-arrow-right"></i>
            Sair
        </a>
    </div>
</nav>

<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Funcionários</h1>
            <p class="text-muted mb-0">
                Cadastre e gerencie os funcionários da clínica.
            </p>
        </div>

        <a th:href="@{/admin/funcionarios/novo}" class="btn btn-success">
            <i class="bi bi-plus-lg"></i>
            Novo funcionário
        </a>
    </div>

    <div th:if="${sucesso}" class="alert alert-success"
         th:text="${sucesso}">
    </div>

    <div th:if="${erro}" class="alert alert-danger"
         th:text="${erro}">
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div th:if="${#lists.isEmpty(funcionarios)}"
                 class="text-center text-muted py-4">
                Nenhum funcionário cadastrado.
            </div>

            <div th:unless="${#lists.isEmpty(funcionarios)}"
                 class="table-responsive">

                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Telefone</th>
                        <th>E-mail</th>
                        <th>Especialidades</th>
                        <th>Status</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="funcionario : ${funcionarios}">
                        <td th:text="${funcionario.nome}"></td>
                        <td th:text="${funcionario.cpf}"></td>
                        <td th:text="${funcionario.telefone}"></td>
                        <td th:text="${funcionario.email}"></td>

                        <td>
                            <span th:each="especialidade, iteracao : ${funcionario.especialidades}">
                                <span th:text="${especialidade.nome}"></span><span
                                    th:if="${!iteracao.last}">, </span>
                            </span>
                        </td>

                        <td>
                            <span th:if="${funcionario.ativo}"
                                  class="badge bg-success">
                                Ativo
                            </span>

                            <span th:unless="${funcionario.ativo}"
                                  class="badge bg-secondary">
                                Inativo
                            </span>
                        </td>

                        <td class="text-end">
                            <a th:href="@{/admin/funcionarios/{id}/editar(id=${funcionario.id})}"
                               class="btn btn-outline-primary btn-sm">
                                <i class="bi bi-pencil"></i>
                                Editar
                            </a>

                            <form th:action="@{/admin/funcionarios/{id}/status(id=${funcionario.id})}"
                                  method="post"
                                  class="d-inline">

                                <button type="submit"
                                        class="btn btn-sm"
                                        th:classappend="${funcionario.ativo} ? ' btn-outline-danger' : ' btn-outline-success'"
                                        th:text="${funcionario.ativo} ? 'Desativar' : 'Ativar'">
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>

            </div>
        </div>
    </div>

    <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary mt-3">
        <i class="bi bi-arrow-left"></i>
        Voltar ao dashboard
    </a>

</main>

</body>
</html>
