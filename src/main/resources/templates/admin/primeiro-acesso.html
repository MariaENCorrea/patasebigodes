
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiro acesso | Patas & Bigodes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">
</head>
<body>

<div class="container min-vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow p-4" style="width: 100%; max-width: 460px;">

        <div class="text-center mb-4">
            <i class="bi bi-shield-lock fs-1 text-success"></i>
            <h2 class="mt-2">Primeiro acesso</h2>
            <p class="text-muted">
                Cadastre o administrador da clínica.
            </p>
        </div>

        <div th:if="${erro}" class="alert alert-danger"
             th:text="${erro}">
        </div>

        <form th:action="@{/admin/primeiro-acesso}" method="post">

            <div class="mb-3">
                <label for="nome" class="form-label">Nome completo</label>
                <input type="text"
                       id="nome"
                       name="nome"
                       class="form-control"
                       required
                       maxlength="100">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email"
                       id="email"
                       name="email"
                       class="form-control"
                       required
                       maxlength="150">
            </div>

            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password"
                       id="senha"
                       name="senha"
                       class="form-control"
                       minlength="8"
                       required>
                <small class="text-muted">
                    A senha deve ter pelo menos 8 caracteres.
                </small>
            </div>

            <div class="mb-3">
                <label for="confirmarSenha" class="form-label">
                    Confirmar senha
                </label>
                <input type="password"
                       id="confirmarSenha"
                       name="confirmarSenha"
                       class="form-control"
                       minlength="8"
                       required>
            </div>

            <button type="submit" class="btn btn-success w-100">
                Cadastrar administrador
            </button>

        </form>

    </div>
</div>

</body>
</html>
