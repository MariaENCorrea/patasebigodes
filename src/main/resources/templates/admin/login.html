
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo | Patas & Bigodes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">
</head>
<body>

<div class="container min-vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow p-4" style="width: 100%; max-width: 420px;">

        <div class="text-center mb-4">
            <i class="bi bi-shield-lock fs-1 text-success"></i>
            <h2 class="mt-2">Área administrativa</h2>
            <p class="text-muted">Clínica Patas & Bigodes</p>
        </div>

        <div th:if="${erro}" class="alert alert-danger"
             th:text="${erro}">
        </div>

        <div th:if="${sucesso}" class="alert alert-success"
             th:text="${sucesso}">
        </div>

        <form th:action="@{/admin/login}" method="post">

            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email"
                       id="email"
                       name="email"
                       class="form-control"
                       placeholder="Digite seu e-mail"
                       required>
            </div>

            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password"
                       id="senha"
                       name="senha"
                       class="form-control"
                       placeholder="Digite sua senha"
                       required>
            </div>

            <button type="submit" class="btn btn-success w-100">
                <i class="bi bi-box-arrow-in-right"></i>
                Entrar
            </button>

        </form>

        <div class="text-center mt-3">
            <a th:href="@{/admin/primeiro-acesso}"
               class="text-decoration-none">
                Primeiro acesso? Cadastrar administrador
            </a>
        </div>

        <div class="text-center mt-2">
            <a th:href="@{/}" class="text-decoration-none">
                Voltar ao site
            </a>
        </div>

    </div>
</div>

</body>
</html>
