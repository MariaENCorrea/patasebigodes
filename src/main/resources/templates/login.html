<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Patas & Bigodes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/login.css}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>

<body>

<header>
    <nav class="navbar">
        <div class="container-fluid px-4">

            <a th:href="@{/}" class="navbar-brand"
               aria-label="Página inicial">
                <img th:src="@{/img/logo.png}"
                     alt="Logo Patas & Bigodes"
                     class="logo">
            </a>

            <a th:href="@{/}" class="btn-voltar"
               title="Voltar para a página inicial"
               aria-label="Voltar para a página inicial">
                <i class="bi bi-arrow-left"></i>
            </a>

        </div>
    </nav>
</header>

<main>

    <section class="inicio">

        <div class="card-clinica">

            <div class="login-icon">
                <i class="bi bi-person-heart"></i>
            </div>

            <h1 class="titulosegundario">
                Bem-vindo à Patas & Bigodes!
            </h1>

            <p class="login-descricao">
                Faça seu login para acessar sua conta e
                acompanhar os cuidados do seu pet.
            </p>

            <form class="formulario"
                  th:action="@{/login}"
                  method="post">

                <div th:if="${mensagem}"
                     class="alert alert-success"
                     role="alert"
                     th:text="${mensagem}">
                </div>

                <div th:if="${erro}"
                     class="alert alert-danger"
                     role="alert"
                     th:text="${erro}">
                </div>

                <label for="email" class="form-label">
                    E-mail
                </label>

                <input type="email"
                       class="form-control"
                       id="email"
                       name="email"
                       placeholder="Digite seu e-mail"
                       maxlength="100"
                       autocomplete="email"
                       required>

                <label for="senha" class="form-label">
                    Senha
                </label>

                <div class="campo-senha">

                    <input type="password"
                           class="form-control"
                           id="senha"
                           name="senha"
                           placeholder="Digite sua senha"
                           maxlength="128"
                           autocomplete="current-password"
                           required>

                    <button type="button"
                            id="mostrarSenha"
                            aria-label="Mostrar senha">
                        <i class="bi bi-eye"></i>
                    </button>

                </div>

                <button type="submit" class="btn-login">
                    <i class="bi bi-box-arrow-in-right"></i>
                    Entrar
                </button>

                <p class="cadastro-link">
                    Ainda não tem uma conta?
                    <a th:href="@{/cadastro}">Cadastre-se</a>
                </p>

            </form>

        </div>

    </section>

</main>

<footer>

    <div class="footer-content">

        <div class="footer-logo">

            <img th:src="@{/img/logo.png}" alt="Patas & Bigodes">

            <div>
                <strong>Patas & Bigodes</strong>

                <span>
                    Cuidado que vira carinho.
                </span>
            </div>

        </div>

        <div class="footer-social">

            <a href="https://www.instagram.com/"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Instagram">
                <i class="bi bi-instagram"></i>
            </a>

            <a href="https://www.facebook.com/"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Facebook">
                <i class="bi bi-facebook"></i>
            </a>

        </div>

        <p>
            © <span th:text="${#dates.year(#dates.createNow())}">2026</span>
            Patas & Bigodes. Todos os direitos reservados.
        </p>

    </div>

</footer>

<script th:src="@{/js/login.js}"></script>

</body>
</html>
